<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangulatnapló</title>
</head>

<body>
  <nav>
    <div class="nav-logo">
      <img src="" alt="Logo">
    </div>
    <ul class="nav-list-items">
      <li class="nav-list-item active"><a href="/index.html">Kezdőoldal</a></li>
      <li class="nav-list-item"><a href="/pages/hangulataim.html">Hangulataim</a></li>
      <li class="nav-list-item"><a href="/pages/statisztika.html">Statisztika</a></li>
    </ul>
    <button id="hamburgerButton">
      <!-- Ide kell majd valami meno hamburger ikont talalni -->
       ham
    </button>
  </nav>
  <div class="container" id="kezdooldalContainer">
    <div class="modal hide" id="modal">
      <div class="modal-header">
        <h2>Visszajelzés</h2>
      </div>
      <div class="modal-body">
        <p id="modalText"></p>
      </div>
      <div class="modal-footer">
        <button id="closeModalButton">OK</button>
      </div>
    </div>
    <h1>Hangulatnapló</h1>
    <form id="hangulatForm">
      <p>Milyen hangulatod van ma?</p>
      <div class="input-group">
        <label for="hangulat0">😀</label>
        <input type="radio" value="0" name="hangulat" id="hangulat0">
        <label for="hangulat1">😐</label>
        <input type="radio" value="1" name="hangulat" id="hangulat1">
        <label for="hangulat2">😢</label>
        <input type="radio" value="2" name="hangulat" id="hangulat2">
        <label for="hangulat3">😴</label>
        <input type="radio" value="3" name="hangulat" id="hangulat3">
        <label for="hangulat4">😡</label>
        <input type="radio" value="4" name="hangulat" id="hangulat4">
      </div>
      <div class="input-group">
        <label for="leiras">Szöveges megjegyzés</label>
        <textarea name="leiras" id="leiras"></textarea>
      </div>
      <input id="postHangulatButton" type="button" value="Mentés">
    </form>
  </div>
  <script type="module" src="/src/scripts/index.ts"></script>
</body>

</html>
